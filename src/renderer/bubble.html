<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>思维板</title>
<link rel="stylesheet" href="./bubble.css">
</head>
<body>
<div class="rz rz-n" data-dir="n"></div>
<div class="rz rz-s" data-dir="s"></div>
<div class="rz rz-e" data-dir="e"></div>
<div class="rz rz-w" data-dir="w"></div>
<div class="rz rz-ne" data-dir="ne"></div>
<div class="rz rz-nw" data-dir="nw"></div>
<div class="rz rz-se" data-dir="se"></div>
<div class="rz rz-sw" data-dir="sw"></div>
<div id="wrap">
  <div class="comic">

    <header id="bd-head">
      <span id="h-glyph"></span>
      <div id="proj-select">
        <button id="proj-trigger" type="button" title="点项目名可改名（切项目走 ☰ 总览）">
          <span id="proj-name">思维板</span>
        </button>
      </div>
      <button id="btn-overview" class="hd-btn" type="button" title="项目总览：当前 harness 参与过的项目">☰</button>
      <button id="btn-font" class="hd-btn" type="button" title="面板字体 / 字号">Aa</button>
      <button id="btn-pin" class="hd-btn" type="button" title="关闭面板（Esc 同效）"></button>
    </header>
    <!-- 字体/字号弹层（放 header 外：header 是拖动区，弹层点击不能触发拖动） -->
    <div id="font-pop" hidden>
      <div class="fp-row"><span class="fp-label">字号</span>
        <button class="fp-opt" data-font="s">小</button><button class="fp-opt" data-font="m">中</button><button class="fp-opt" data-font="l">大</button>
      </div>
      <div class="fp-row"><span class="fp-label">字体</span>
        <button class="fp-opt" data-ff="georgia">衬线</button><button class="fp-opt" data-ff="song">宋体</button><button class="fp-opt" data-ff="kai">楷体</button><button class="fp-opt" data-ff="sans">无衬线</button><button class="fp-opt" data-ff="hei">黑体</button>
      </div>
    </div>

    <!-- 总览视图：一屏看全部项目，点行切换 -->
    <div id="overview-view" hidden>
      <div class="ov-bar">
        <span class="sec-label">全部项目</span>
        <button id="ov-dashboard" class="ov-dash" type="button">⛶ 大窗口仪表盘</button>
      </div>
      <div id="ov-list"></div>
    </div>

    <div id="pending-banner" data-i18n="pending" hidden>⚠ 疑似新目标待确认——去问问你的 AI？</div>

    <section id="goal-bar">
      <div class="sec-label" data-i18n="goal">目标</div>
      <div id="goal-list" class="mt-goals"></div>
      <div id="hp-row" title="思路进度：已敲定要点占比">
        <span id="hp-label">进度</span>
        <div id="hp-bar"></div>
        <em id="hp-text"></em>
      </div>
    </section>

    <main id="layers">
      <!-- 价值维 Why -->
      <details open class="layer dim-why" title="价值维 · 需求锚点：触发场景/痛点">
        <summary>需求锚点 <em id="c-anchor"></em></summary>
        <ul class="items" id="list-anchor"></ul>
      </details>
      <details open class="layer dim-why" title="价值维 · 受众画像：核心受众行为特征">
        <summary>受众画像 <em id="c-audience"></em></summary>
        <ul class="items" id="list-audience"></ul>
      </details>
      <details open class="layer dim-why" title="价值维 · 价值主张：一句话通过__为__解决__">
        <summary>价值主张 <em id="c-proposition"></em></summary>
        <ul class="items" id="list-proposition"></ul>
      </details>
      <!-- 结构维 What -->
      <details open class="layer dim-what" title="结构维 · 功能拆解：模块名+一句话职责">
        <summary>功能拆解 <em id="c-modules"></em></summary>
        <ul class="items" id="list-modules"></ul>
      </details>
      <details open class="layer dim-what" title="结构维 · 骨架识别：删掉就垮的核心模块">
        <summary>骨架识别 <em id="c-skeleton"></em></summary>
        <ul class="items" id="list-skeleton"></ul>
      </details>
      <details open class="layer dim-what" title="结构维 · 边界定义：明确不做">
        <summary>边界定义 <em id="c-boundaries"></em></summary>
        <ul class="items" id="list-boundaries"></ul>
      </details>
      <!-- 路径维 How -->
      <details open class="layer dim-how" title="路径维 · 核心链路：步骤名→输出">
        <summary>核心链路 <em id="c-link"></em></summary>
        <ul class="items" id="list-link"></ul>
      </details>
      <details open class="layer dim-how" title="路径维 · 依赖与瓶颈：缺什么/卡在哪">
        <summary>依赖与瓶颈 <em id="c-bottlenecks"></em></summary>
        <ul class="items" id="list-bottlenecks"></ul>
      </details>
      <details open class="layer dim-how" title="路径维 · 反馈闭环：什么信息回流">
        <summary>反馈闭环 <em id="c-feedback"></em></summary>
        <ul class="items" id="list-feedback"></ul>
      </details>
    </main>

  </div>
</div>

<!-- 拖动时从底部滑入：绿=标记已实现（仅想法）；红=删除。平时不显示 -->
<div class="dz-stack" id="dz-stack">
  <div id="togg-zone" class="dz-float dz-toggle" hidden>
    <span class="dz-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    <span data-i18n="dz.done">松手标记已实现</span>
    <span class="dz-sub" data-i18n="dz.done.sub">已实现的想法会折叠收起</span>
  </div>
  <div id="del-zone" class="dz-float dz-del" hidden>
    <span class="dz-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg></span>
    <span data-i18n="dz.del">松手删除</span>
    <span class="dz-sub" data-i18n="dz.del.sub">目标与条目都可拖到这里</span>
  </div>
</div>

<!-- 危险操作二次确认（项目删除等） -->
<div id="confirm-mask" hidden>
  <div id="confirm-box">
    <div id="cf-title">删除这块思维板？</div>
    <p id="cf-text"></p>
    <div class="cf-btns">
      <button id="cf-cancel" type="button">取消</button>
      <button id="cf-ok" type="button">确认删除</button>
    </div>
  </div>
</div>

<!-- 要点预览：面板内 iframe 加载完整版 -->
<div id="preview-mask" hidden>
  <div id="preview-box">
    <div class="pv-head">
      <span id="pv-title"></span>
      <button id="pv-open" type="button" title="在系统浏览器打开完整版">↗ 浏览器</button>
      <button id="pv-close" type="button" title="关闭预览 (Esc)">×</button>
    </div>
    <iframe id="pv-frame" src="about:blank"></iframe>
  </div>
</div>

<script src="./i18n.js"></script>
<script src="./bubble.js"></script>
</body>
</html>
