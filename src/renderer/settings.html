<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>设置</title>
<link rel="stylesheet" href="./pet.css">
<link rel="stylesheet" href="./pet-panels.css">
</head>
<body>
<div id="settings">
  <div class="st-title" data-i18n="settings.title">设置</div>

  <div class="st-group">
    <div class="st-group-title" data-i18n="group.organize">整理</div>
    <button class="st-row" id="st-mode"><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.7 4.8L18.5 10l-4.8 1.7L12 16.5l-1.7-4.8L5.5 10l4.8-1.2z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span><span class="st-lb" data-i18n="mode">整理模式</span><b id="st-mode-v">关</b></button>
    <button class="st-row sub-toggle" id="st-interval">
      <span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span>
      <span class="st-lb" data-i18n="interval">整理频率</span>
      <b class="st-val" id="st-interval-v">2 轮</b>
      <b class="st-arrow">›</b>
    </button>
    <div class="st-sub" id="st-interval-sub" hidden>
      <button class="st-opt" data-v="1"></button>
      <button class="st-opt" data-v="2"></button>
      <button class="st-opt" data-v="3"></button>
    </div>
  </div>

  <div class="st-group">
    <div class="st-group-title" data-i18n="group.window">窗口</div>
    <button class="st-row" id="st-pin"><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></span><span class="st-lb" data-i18n="pin">窗口置顶</span><b id="st-pin-v">开</b></button>
  </div>

  <div class="st-group">
    <div class="st-group-title" data-i18n="group.data">数据</div>
    <button class="st-row" id="st-cal"><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></span><span class="st-lb">图标环标定</span><b class="st-arrow">›</b></button>
    <button class="st-row" id="st-data"><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="st-lb" data-i18n="dataDir">数据目录</span><b class="st-arrow">›</b></button>
  </div>

  <div class="st-group">
    <div class="st-group-title" data-i18n="group.app">应用</div>
    <button class="st-row" id="st-language"><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 5.6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.6-4-9s1.5-6.4 4-9z"/></svg></span><span class="st-lb" data-i18n="lang">语言 Language</span><b id="st-language-v">中文</b></button>
    <button class="st-row" id="st-autostart" title=""><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></span><span class="st-lb" data-i18n="autostart">开机自启</span><b id="st-autostart-v">关</b></button>
    <button class="st-row" id="st-hide"><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.2A10 10 0 0 1 12 4c7 0 10 8 10 8a17 17 0 0 1-2 3.1M6.6 6.6A16 16 0 0 0 2 12s3 8 10 8a10 10 0 0 0 5.4-1.6"/><path d="M2 2l20 20"/></svg></span><span class="st-lb" data-i18n="hide">先躲一下</span><em class="st-note" data-i18n="hide.note">后台继续</em></button>
    <button class="st-row danger" id="st-quit"><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></span><span class="st-lb" data-i18n="quit">彻底退下</span><b class="st-arrow">›</b></button>
  </div>
</div>

<script src="./i18n.js"></script>
<script src="./settings.js"></script>
</body>
</html>
