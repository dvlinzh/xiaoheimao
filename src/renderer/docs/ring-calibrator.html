<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图标环 · 标定</title>
<style>
  :root {
    --bg: #0d0d0f; --card: #141416; --card2: #1b1b1f; --line: #28282e;
    --line2: #34343c; --text: #ececec; --dim: #9a9aa2; --faint: #66666e;
    --amber: #fbbf24; --red: #f0716c; --sky: #5ea3f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 16px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.6; }
  h3 { margin: 0 0 10px; font-size: 12.5px; color: var(--dim); letter-spacing: 1px; }
  .cols { display: flex; gap: 16px; }
  #stage { position: relative; flex: none; width: 380px; height: 440px;
    background: #101013; border: 1px solid var(--line2); border-radius: 8px;
    overflow: hidden; cursor: crosshair; }
  #stage svg, #catImg { position: absolute; }
  .ctls { flex: 1; min-width: 280px; }
  .ctl { margin-bottom: 11px; }
  .ctl label { display: flex; justify-content: space-between; color: var(--dim);
    font-size: 12.5px; margin-bottom: 3px; }
  .ctl label output { color: var(--amber); font-family: Consolas, monospace; }
  .ctl input[type=range] { width: 100%; accent-color: var(--amber); }
  .out { background: #0a0a0c; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-family: Consolas, monospace; font-size: 11.5px;
    color: var(--teal); white-space: pre; line-height: 1.55; margin-top: 12px; }
  .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  button { padding: 6px 13px; background: var(--card2); color: var(--text);
    border: 1px solid var(--line2); border-radius: 8px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--amber); }
  .note { color: var(--faint); font-size: 11.5px; margin-top: 8px; }
</style>
</head>
<body>
<h3>图标环标定 · 拖红十字调圆心，滚轮调半径</h3>
<div class="cols">
  <div id="stage">
    <img id="catImg" src="../assets/cat/cat-idle.png" draggable="false">
    <svg id="ov" width="380" height="440" viewBox="0 0 380 440"></svg>
  </div>
  <div class="ctls">
    <div class="ctl"><label>圆心 X<output id="o-cx"></output></label>
      <input type="range" id="i-cx" min="10" max="180" step="1"></div>
    <div class="ctl"><label>圆心 Y<output id="o-cy"></output></label>
      <input type="range" id="i-cy" min="20" max="210" step="1"></div>
    <div class="ctl"><label>半径 R<output id="o-r"></output></label>
      <input type="range" id="i-r" min="40" max="140" step="1"></div>
    <div class="ctl"><label>张角<output id="o-span"></output></label>
      <input type="range" id="i-span" min="30" max="180" step="5"></div>
    <div class="ctl"><label>起始角<output id="o-start"></output></label>
      <input type="range" id="i-start" min="-180" max="-60" step="5"></div>
    <div class="ctl"><label>芯片数（预览）<output id="o-n"></output></label>
      <input type="range" id="i-n" min="1" max="5" step="1"></div>
    <div class="ctl"><label>猫埋入任务栏深度<output id="o-bury"></output></label>
      <input type="range" id="i-bury" min="-10" max="40" step="1"></div>
    <div class="row">
      <button id="b-reset">恢复默认 (95,95) R75 120°</button>
      <span class="note">改动实时生效并保存</span>
    </div>
    <div class="out" id="coords"></div>
  </div>
</div>
<script>
const SC = 2;                          // 预览放大倍数
const CHIPS = [
  { h: "claude-code", color: "#fbbf24", label: "✦" },
  { h: "dsh",         color: "#5ea3f7", label: "🐳" },
  { h: "codex",       color: "#5eead4", label: "◈" },
  { h: "gemini",      color: "#60a5fa", label: "✧" },
  { h: "opencode",    color: "#c8c8cc", label: "◐" },
];
const DEF = { cx: 95, cy: 95, r: 75, span: 120, start: -90, bury: 13 };
const S = { ...DEF };
let saveT = null;

const $ = (s) => document.querySelector(s);
const stage = $("#stage"), catImg = $("#catImg"), ov = $("#ov");

function load() {
  fetch("/api/ui-params").then((r) => r.json()).then((ui) => {
    S.cx = ui.dock?.cx ?? DEF.cx; S.cy = ui.dock?.cy ?? DEF.cy;
    S.r = ui.dock?.r ?? DEF.r;   S.span = ui.dock?.span ?? DEF.span;
    S.start = ui.dock?.start ?? DEF.start;
    S.bury = ui.pet?.bury ?? DEF.bury;
    syncInputs(); draw();
  }).catch(() => { syncInputs(); draw(); });
}

function layout() {
  const w = 110 * SC, h = 134 * SC, bury = S.bury * SC;
  catImg.style.width = w + "px";
  catImg.style.height = h + "px";
  catImg.style.left = ((380 - w) / 2) + "px";
  catImg.style.top = (440 - bury - h) + "px";
}

function syncInputs() {
  $("#i-cx").value = S.cx;   $("#o-cx").value = S.cx;
  $("#i-cy").value = S.cy;   $("#o-cy").value = S.cy;
  $("#i-r").value = S.r;     $("#o-r").value = S.r;
  $("#i-span").value = S.span; $("#o-span").value = S.span;
  $("#i-start").value = S.start; $("#o-start").value = S.start;
  $("#i-n").value = Math.min(2, 5); $("#o-n").value = 2;
  $("#i-bury").value = S.bury; $("#o-bury").value = S.bury;
}

function chipPos(i) {
  const deg = S.start - (S.span / 1) * i;   // n=2：两枚在扇形两端
  const rad = deg * Math.PI / 180;
  return { deg, x: S.cx + S.r * Math.cos(rad), y: S.cy + S.r * Math.sin(rad) };
}

const P = (v) => v * SC;

function draw() {
  layout();
  const cx = P(S.cx), cy = P(S.cy);
  const c0 = chipPos(0), c1 = chipPos(1);
  let h = "";
  // 扇形两边 + 弧
  h += `<line x1="${cx}" y1="${cy}" x2="${P(c0.x)}" y2="${P(c0.y)}" stroke="#66666e" stroke-dasharray="3 4"/>`;
  h += `<line x1="${cx}" y1="${cy}" x2="${P(c1.x)}" y2="${P(c1.y)}" stroke="#66666e" stroke-dasharray="3 4"/>`;
  h += `<path d="M${P(c0.x)} ${P(c0.y)} A ${P(S.r)} ${P(S.r)} 0 0 1 ${P(c1.x)} ${P(c1.y)}" fill="none" stroke="#28282e" stroke-dasharray="5 5"/>`;
  // 圆心十字（拖动手柄）
  h += `<g id="drag-cross">
    <circle cx="${cx}" cy="${cy}" r="14" fill="rgba(240,113,108,.12)" stroke="#f0716c" stroke-width="1.4"/>
    <line x1="${cx - 9}" y1="${cy}" x2="${cx + 9}" y2="${cy}" stroke="#f0716c" stroke-width="1.6"/>
    <line x1="${cx}" y1="${cy - 9}" x2="${cx}" y2="${cy + 9}" stroke="#f0716c" stroke-width="1.6"/>
  </g>`;
  // 芯片
  const chip = (p, th, live) => {
    h += `<circle cx="${P(p.x)}" cy="${P(p.y)}" r="37" fill="#16161e" stroke="#34343c" stroke-width="2.4"/>`;
    if (live) h += `<circle cx="${P(p.x)}" cy="${P(p.y)}" r="41" fill="none" stroke="${th.color}" stroke-opacity=".5" stroke-width="2.5"/>`;
    h += `<text x="${P(p.x)}" y="${P(p.y) + 8}" text-anchor="middle" font-size="26" fill="${th.color}">${th.label}</text>`;
    h += `<text x="${P(p.x)}" y="${P(p.y) - 46}" text-anchor="middle" font-size="14" fill="#9a9aa2">${p.deg.toFixed(0)}°</text>`;
  };
  chip(c0, CHIPS[0], true);
  chip(c1, CHIPS[1], false);
  ov.innerHTML = h;
}

function outputs() {
  const d = Math.hypot(c0x() - c1x(), c0y() - c1y());
  function c0x() { return chipPos(0).x; } function c0y() { return chipPos(0).y; }
  function c1x() { return chipPos(1).x; } function c1y() { return chipPos(1).y; }
  $("#coords").textContent =
    `圆心(窗内): (${S.cx}, ${S.cy})\n` +
    `claude: 窗(${c0x().toFixed(0)},${c0y().toFixed(0)}) @${chipPos(0).deg.toFixed(0)}°\n` +
    `dsh:    窗(${c1x().toFixed(0)},${c1y().toFixed(0)}) @${chipPos(1).deg.toFixed(0)}°\n` +
    `两芯片间距: ${d.toFixed(0)}px`;
}

function persist() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    fetch("/api/ui-params", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dock: { cx: S.cx, cy: S.cy, r: S.r, span: S.span, start: S.start }, pet: { bury: S.bury } }),
    }).catch(() => {});
  }, 180);
}

function render() { syncInputs(); draw(); outputs(); persist(); }

/* ── 拖动圆心十字 ── */
let dragging = false;
function stagePt(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / SC, y: (e.clientY - r.top) / SC };
}
stage.addEventListener("mousedown", (e) => {
  const p = stagePt(e);
  if (Math.hypot(p.x - S.cx, p.y - S.cy) < 26) { dragging = true; e.preventDefault(); }
});
document.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  const p = stagePt(e);
  S.cx = Math.round(Math.min(180, Math.max(10, p.x)));
  S.cy = Math.round(Math.min(210, Math.max(20, p.y)));
  render();
});
document.addEventListener("mouseup", () => { dragging = false; });

/* ── 滑杆 ── */
for (const [id, key] of [["i-cx","cx"],["i-cy","cy"],["i-r","r"],["i-span","span"],["i-start","start"],["i-bury","bury"]]) {
  $("#" + id).addEventListener("input", (e) => { S[key] = +e.target.value; render(); });
}
$("#b-reset").addEventListener("click", () => { Object.assign(S, DEF); render(); });

load();
