<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图标环 · 标定</title>
<style>
  :root {
    --bg: #0d0d0f; --card: #141416; --card2: #1b1b1f; --line: #28282e;
    --line2: #34343c; --text: #ececec; --dim: #9a9aa2; --faint: #66666e;
    --amber: #fbbf24; --red: #f0716c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 18px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.6; }
  h3 { margin: 0 0 10px; font-size: 13px; color: var(--dim); letter-spacing: 1px; }
  .cols { display: flex; gap: 18px; }
  #stageWrap { position: relative; flex: none; width: 380px; height: 440px;
    background: #101013; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
  #stageWrap svg, #catImg { position: absolute; }
  .ctls { flex: 1; min-width: 300px; }
  .ctl { margin-bottom: 12px; }
  .ctl label { display: flex; justify-content: space-between; color: var(--dim); font-size: 12.5px; margin-bottom: 3px; }
  .ctl label output { color: var(--amber); font-family: Consolas, monospace; }
  .ctl input[type=range] { width: 100%; accent-color: var(--amber); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  button { padding: 7px 14px; background: var(--card2); color: var(--text);
    border: 1px solid var(--line2); border-radius: 8px; cursor: pointer; font-size: 12.5px; }
  button:hover { border-color: var(--amber); }
  .out { background: #0a0a0c; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-family: Consolas, monospace; font-size: 11.5px;
    color: var(--teal); white-space: pre; line-height: 1.55; margin-top: 14px; }
  .note { color: var(--faint); font-size: 11.5px; margin-top: 10px; }
  .saved { color: var(--green, #58a873); }
</style>
</head>
<body>
<h3>图标环标定 · 实时预览（pet 窗 ×2）</h3>
<div class="cols">
  <div id="stageWrap">
    <img id="catImg" src="../assets/cat/cat-idle.png" alt="">
    <svg id="ov" width="380" height="440" viewBox="0 0 380 440"></svg>
  </div>
  <div class="ctls">
    <div class="ctl"><label>圆心 X（窗内水平）<output id="o-cx"></output></label>
      <input type="range" id="i-cx" min="40" max="150" step="1"></div>
    <div class="ctl"><label>圆心 Y（窗内垂直）<output id="o-cy"></output></label>
      <input type="range" id="i-cy" min="30" max="180" step="1"></div>
    <div class="ctl"><label>半径 R<output id="o-r"></output></label>
      <input type="range" id="i-r" min="40" max="140" step="1"></div>
    <div class="ctl"><label>张角（垂直边 → 左下）<output id="o-span"></output></label>
      <input type="range" id="i-span" min="30" max="180" step="5"></div>
    <div class="ctl"><label>猫埋入任务栏深度<output id="o-bury"></output></label>
      <input type="range" id="i-bury" min="-10" max="40" step="1"></div>
    <div class="row">
      <button id="b-reset">恢复默认</button>
      <span class="note" style="margin:0;align-self:center;">改动实时写入并生效，重启后保持</span>
    </div>
    <div class="out" id="coords"></div>
  </div>
</div>
<script>
const CAT = { w: 110, h: 134 };       // 素材显示尺寸（262×320 @0.42）
const SC = 2;                          // 预览放大倍数
const DEF = { cx: 95, cy: 95, r: 75, span: 120, start: -90, bury: 13 };
const S = { ...DEF };
let saveTimer = null;

const $ = (s) => document.querySelector(s);
const catImg = $("#catImg");
const P = (v) => v * SC;

async function load() {
  try {
    const ui = await fetch("/api/ui-params").then((r) => r.json());
    S.cx = ui.dock?.cx ?? DEF.cx; S.cy = ui.dock?.cy ?? DEF.cy;
    S.r = ui.dock?.r ?? DEF.r; S.span = ui.dock?.span ?? DEF.span;
    S.start = ui.dock?.start ?? DEF.start; S.bury = ui.pet?.bury ?? DEF.bury;
  } catch {}
  syncInputs(); layout(); draw(); outputs();
}

function syncInputs() {
  $("#i-cx").value = S.cx; $("#o-cx").value = S.cx;
  $("#i-cy").value = S.cy; $("#o-cy").value = S.cy;
  $("#i-r").value = S.r;  $("#o-r").value = S.r;
  $("#i-span").value = S.span; $("#o-span").value = S.span;
  $("#i-bury").value = S.bury; $("#o-bury").value = S.bury;
}

function layout() {
  const w = CAT.w * SC, h = CAT.h * SC;
  catImg.style.width = w + "px";
  catImg.style.height = h + "px";
  catImg.style.left = ((380 - w) / 2) + "px";
  catImg.style.top = (440 - 2 * S.bury - h) + "px";
}

function chipPos(i, n) {
  const deg = S.start - (S.span / Math.max(1, n - 1)) * i;
  const rad = deg * Math.PI / 180;
  return { deg, x: S.cx + S.r * Math.cos(rad), y: S.cy + S.r * Math.sin(rad) };
}

function draw() {
  const h = [];
  const cxy = { x: P(S.cx), y: P(S.cy) };
  // 圆心十字
  h += `<line x1="${cxy.x - 10}" y1="${cxy.y}" x2="${cxy.x + 10}" y2="${cxy.y}" stroke="#f0716c" stroke-width="1.6"/>`;
  h += `<line x1="${cxy.x}" y1="${cxy.y - 10}" x2="${cxy.x}" y2="${cxy.y + 10}" stroke="#f0716c" stroke-width="1.6"/>`;
  h += `<circle cx="${cxy.x}" cy="${cxy.y}" r="4" fill="none" stroke="#f0716c" stroke-width="1.3"/>`;
  // 扇形（n=2 两枚芯片：claude 在垂直边，dsh 在左下）
  const c0 = chipPos(0, 2), c1 = chipPos(1, 2);
  h += `<line x1="${cxy.x}" y1="${cxy.y}" x2="${P(c0.x)}" y2="${P(c0.y)}" stroke="#66666e" stroke-dasharray="3 4"/>`;
  h += `<line x1="${cxy.x}" y1="${cxy.y}" x2="${P(c1.x)}" y2="${P(c1.y)}" stroke="#66666e" stroke-dasharray="3 4"/>`;
  h += `<path d="M${P(c0.x)} ${P(c0.y)} A ${P(S.r)} ${P(S.r)} 0 0 0 ${P(c1.x)} ${P(c1.y)}" fill="none" stroke="#28282e" stroke-dasharray="5 5"/>`;
  // 芯片
  const chip = (p, color, label, live) => {
    h += `<circle cx="${P(p.x)}" cy="${P(p.y)}" r="37" fill="#16161e" stroke="#34343c" stroke-width="2.4"/>`;
    if (live) h += `<circle cx="${P(p.x)}" cy="${P(p.y)}" r="41" fill="none" stroke="${color}" stroke-opacity=".5" stroke-width="2.5"/>`;
    h += `<text x="${P(p.x)}" y="${P(p.y) + 8}" text-anchor="middle" font-size="26" fill="${color}">${label}</text>`;
    h += `<text x="${P(p.x)}" y="${P(p.y) - 48}" text-anchor="middle" font-size="14" fill="#9a9aa2">${p.deg.toFixed(0)}°</text>`;
  };
  chip(c0, "#fbbf24", "✦", true);
  chip(c1, "#5ea3f7", "🐳", false);
  $("#ov").innerHTML = h;
}

function outputs() {
  const c0 = chipPos(0, 2), c1 = chipPos(1, 2);
  $("#coords").textContent =
    `圆心(窗内): (${S.cx}, ${S.cy})\n` +
    `claude: 窗(${c0.x.toFixed(0)},${c0.y.toFixed(0)}) @${c0.deg.toFixed(0)}°\n` +
    `dsh:    窗(${c1.x.toFixed(0)},${c1.y.toFixed(0)}) @${c1.deg.toFixed(0)}°`;
}

let saveT = null;
function persist() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    fetch("/api/ui-params", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dock: { cx: S.cx, cy: S.cy, r: S.r, span: S.span, start: S.start }, pet: { bury: S.bury } }),
    }).catch(() => {});
  }, 200);
}

function onCtl(key) {
  return (e) => {
    S[key] = +e.target.value;
    syncInputs(); layout(); draw(); outputs(); persist();
  };
}
for (const [id, key] of [["i-cx","cx"],["i-cy","cy"],["i-r","r"],["i-span","span"],["i-bury","bury"]]) {
  $("#" + id).addEventListener("input", onCtl(key));
}
$("#b-reset").addEventListener("click", () => {
  Object.assign(S, DEF); syncInputs(); layout(); draw(); outputs(); persist();
});

load();
</script>
</body>
</html>
