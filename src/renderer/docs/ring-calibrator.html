<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图标环 · 交互标定工具</title>
<style>
  :root {
    --bg: #0d0d0f; --card: #141416; --card2: #1b1b1f; --line: #28282e;
    --line2: #34343c; --text: #ececec; --dim: #9a9aa2; --faint: #66666e;
    --amber: #fbbf24; --teal: #5eead4; --sky: #5ea3f7; --violet: #8b7cf6; --red: #f0716c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); padding: 28px 24px 60px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; line-height: 1.7;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-family: Georgia, "Songti SC", serif; font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13.5px; margin-bottom: 24px; }
  .cols { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
  }
  .panel h3 { margin: 0 0 12px; font-size: 14px; color: var(--dim); letter-spacing: 1px; }
  /* 舞台 */
  #stageWrap { position: relative; width: 380px; height: 440px; background: #101013;
    border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
  #stageWrap svg { position: absolute; inset: 0; }
  #catImg { position: absolute; image-rendering: auto; }
  /* 控件 */
  .ctl { margin-bottom: 14px; }
  .ctl label { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; margin-bottom: 4px; }
  .ctl label output { color: var(--amber); font-family: Consolas, monospace; }
  .ctl input[type=range] { width: 100%; accent-color: var(--amber); }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 7px 0; background: var(--card2); color: var(--dim);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .seg button.on { color: var(--text); border-color: var(--amber); background: rgba(251,191,36,.08); }
  .out {
    background: #0a0a0c; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-family: Consolas, monospace; font-size: 12px;
    color: var(--teal); white-space: pre; overflow-x: auto; line-height: 1.6;
  }
  .note { color: var(--faint); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>图标环 · 交互标定工具</h1>
  <p class="sub">拖滑杆实时调整扇形参数，三种吸附场景同步预览；调好后点「生成参数」，把输出贴给开发（或直接改 dock.js）。</p>

  <div class="cols">
    <!-- 舞台 -->
    <div class="panel">
      <h3>预览（pet 窗 ×2，真实素材）</h3>
      <div id="stageWrap">
        <img id="catImg" src="../assets/cat/cat-idle.png" alt="cat">
        <svg id="ov" width="380" height="440" viewBox="0 0 380 440"></svg>
      </div>
      <div class="note">灰显芯片 = 未运行；亮圈 = 运行中（示意）。任务栏模式窗口底压入任务栏 13px。</div>
    </div>

    <!-- 控件 + 输出 -->
    <div class="panel" style="flex:1; min-width:360px;">
      <h3>参数</h3>
      <div class="ctl"><label>圆心 X（窗内）<output id="o-cx"></output></label>
        <input type="range" id="i-cx" min="40" max="150" step="1"></div>
      <div class="ctl"><label>圆心 Y（窗内）<output id="o-cy"></output></label>
        <input type="range" id="i-cy" min="30" max="180" step="1"></div>
      <div class="ctl"><label>半径 R<output id="o-r"></output></label>
        <input type="range" id="i-r" min="40" max="140" step="1"></div>
      <div class="ctl"><label>扇形张角<output id="o-span"></output></label>
        <input type="range" id="i-span" min="30" max="180" step="5"></div>
      <div class="ctl"><label>垂直边起始角<output id="o-start"></output></label>
        <input type="range" id="i-start" min="-180" max="-60" step="5"></div>
      <div class="ctl"><label>芯片数量<output id="o-n"></output></label>
        <input type="range" id="i-n" min="1" max="5" step="1"></div>
      <div class="ctl"><label>猫埋入任务栏深度<output id="o-bury"></output></label>
        <input type="range" id="i-bury" min="-10" max="40" step="1"></div>
      <div class="ctl"><label>吸附场景</label>
        <div class="seg" id="edge-seg">
          <button data-e="taskbar" class="on">任务栏</button>
          <button data-e="right">右缘</button>
          <button data-e="left">左缘（镜像）</button>
        </div>
      </div>
      <div class="ctl" style="display:flex;gap:10px;align-items:center;">
        <input type="checkbox" id="i-live" checked style="accent-color:var(--amber)">
        <label for="i-live" style="margin:0;color:var(--text)">实时应用到运行中的猫</label>
        <button id="i-reset" style="margin-left:auto;padding:5px 12px;background:var(--card2);color:var(--dim);border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:12px;">恢复默认</button>
      </div>
      <h3 style="margin-top:18px">实时坐标</h3>
      <div class="out" id="coords"></div>
      <h3 style="margin-top:18px">生成的 dock.js 参数</h3>
      <div class="out" id="gen"></div>
      <div class="note">确认后把这三行贴给开发替换 dock.js 顶部的 R / arcPos 与 main.cjs 的 positionDock 偏移。</div>
    </div>
  </div>
</div>

<script>
/* 与 dock.js 相同的芯片主题 */
const THEME = {
  "claude-code": { color: "#fbbf24", label: "✦", name: "claude-code" },
  "dsh":         { color: "#5ea3f7", label: "🐳", name: "dsh" },
  "codex":       { color: "#5eead4", label: "◈", name: "codex" },
  "gemini":      { color: "#60a5fa", label: "✧", name: "gemini" },
  "opencode":    { color: "#c8c8cc", label: "◐", name: "opencode" },
};
const HARNESS = ["claude-code", "dsh", "codex", "gemini", "opencode"];

const S = { cx: 95, cy: 95, r: 75, span: 120, start: -90, n: 2, edge: "taskbar", bury: 13, live: true };
const SC = 2;                      // 预览放大倍数（pet 窗 190×220 → 380×440）
const CAT = { w: 110, h: 134, bury: 13 };   // 素材显示尺寸与埋入深度（与皮肤一致）

const $ = (s) => document.querySelector(s);
const catImg = $("#catImg");

function layout() {
  // 素材摆放：水平居中、脚底贴“任务栏上沿 +bury 埋入”（与皮肤一致）
  const w = CAT.w * SC, h = CAT.h * SC;
  catImg.style.width = w + "px";
  catImg.style.height = h + "px";
  catImg.style.left = ((380 - w) / 2) + "px";
  catImg.style.top = (440 - 2 * S.bury - h) + "px";
}

function chipPos(i, n) {
  const deg = S.start - (S.span / Math.max(1, n - 1)) * i;
  const rad = deg * Math.PI / 180;
  return { deg, x: S.cx + S.r * Math.cos(rad), y: S.cy + S.r * Math.sin(rad) };
}

function draw() {
  const svg = $("#ov");
  const P = (v) => v * SC;
  let h = "";
  // 圆心十字
  h += `<line x1="${P(S.cx)-10}" y1="${P(S.cy)}" x2="${P(S.cx)+10}" y2="${P(S.cy)}" stroke="#f0716c" stroke-width="1.6"/>`;
  h += `<line x1="${P(S.cx)}" y1="${P(S.cy)-10}" x2="${P(S.cx)}" y2="${P(S.cy)+10}" stroke="#f0716c" stroke-width="1.6"/>`;
  h += `<circle cx="${P(S.cx)}" cy="${P(S.cy)}" r="4" fill="none" stroke="#f0716c" stroke-width="1.3"/>`;
  // 扇形两条边 + 弧
  const e0 = chipPos(0, Math.max(S.n,2)), e1 = chipPos(S.n-1, Math.max(S.n,2));
  h += `<line x1="${P(S.cx)}" y1="${P(S.cy)}" x2="${P(e0.x)}" y2="${P(e0.y)}" stroke="#66666e" stroke-dasharray="3 4"/>`;
  h += `<line x1="${P(S.cx)}" y1="${P(S.cy)}" x2="${P(e1.x)}" y2="${P(e1.y)}" stroke="#66666e" stroke-dasharray="3 4"/>`;
  if (S.n > 1) {
    h += `<path d="M${P(e0.x)} ${P(e0.y)} A ${P(S.r)} ${P(S.r)} 0 ${S.span>180?1:0} 1 ${P(e1.x)} ${P(e1.y)}"
            fill="none" stroke="#28282e" stroke-dasharray="5 5"/>`;
  }
  // 芯片
  for (let i = 0; i < S.n; i++) {
    const p = chipPos(i, S.n);
    const th = THEME[HARNESS[i]] || THEME.opencode;
    const live = i === 0;
    h += `<g>
      <circle cx="${P(p.x)}" cy="${P(p.y)}" r="37" fill="#16161e" stroke="#34343c" stroke-width="2.4"/>
      ${live ? `<circle cx="${P(p.x)}" cy="${P(p.y)}" r="41" fill="none" stroke="${th.color}" stroke-opacity=".5" stroke-width="2.5"/>` : ""}
      <text x="${P(p.x)}" y="${P(p.y)+8}" text-anchor="middle" font-size="26" fill="${th.color}">${th.label}</text>
      <text x="${P(p.x)}" y="${P(p.y)-48}" text-anchor="middle" font-size="15" fill="#9a9aa2">${th.name} ${Math.round(p.deg)}°</text>
    </g>`;
  }
  svg.innerHTML = h;
}

function outputs() {
  const chips = [];
  for (let i = 0; i < S.n; i++) {
    const p = chipPos(i, S.n);
    chips.push(`${HARNESS[i]}: 窗(${p.x.toFixed(0)},${p.y.toFixed(0)}) 角度${p.deg.toFixed(0)}°`);
  }
  $("#coords").textContent =
    `圆心(窗内): (${S.cx}, ${S.cy})\n` +
    chips.join("\n") +
    `\n两芯片间距: ${S.n>1 ? Math.hypot(chipPos(0,S.n).x-chipPos(1,S.n).x, chipPos(0,S.n).y-chipPos(1,S.n).y).toFixed(0) : "-"}px`;
  $("#gen").textContent =
    `dock.js:\n` +
    `const R = ${S.r};\n` +
    `const CX = ${S.cx + 55}, CY = 168;   // 圆心=窗(${S.cx},${S.cy})\n` +
    `const SPAN = ${S.span}, START = ${S.start};\n` +
    `deg = START - (SPAN/(n-1))·i\n\n` +
    `main.cjs · positionDock:\n` +
    `dockX = petX - 55；dockY = petY + ${S.cy - 168}；DOCK_H ≥ ${Math.max(232, Math.ceil(S.cy + S.r + 30))}`;
}

function syncOutputs() {
  $("#o-cx").value = S.cx; $("#o-cy").value = S.cy; $("#o-r").value = S.r;
  $("#o-span").value = S.span; $("#o-start").value = S.start; $("#o-n").value = S.n;
}
let applyTimer = null;
async function liveApply() {
  if (!$("#i-live")?.checked) return;
  clearTimeout(applyTimer);
  applyTimer = setTimeout(async () => {
    try {
      await fetch("/api/ui-params", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          dock: { cx: S.cx, cy: S.cy, r: S.r, span: S.span, start: S.start },
          pet: { bury: S.bury },
        }),
      });
    } catch {}
  }, 150);
}
function render() {
  syncOutputs(); draw(); liveApply();
}
for (const [id, key] of [["i-cx","cx"],["i-cy","cy"],["i-r","r"],["i-span","span"],["i-start","start"],["i-n","n"]]) {
  $("#" + id).addEventListener("input", (e) => { S[key] = +e.target.value; render(); });
}
$("#edge-seg").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  $("#edge-seg .on")?.classList.remove("on"); b.classList.add("on");
  S.edge = b.dataset.e; render();
});
$("#i-reset").addEventListener("click", () => {
  Object.assign(S, { cx: 95, cy: 95, r: 75, span: 120, start: -90, n: 2, bury: 13 });
  for (const [id, key] of [["i-cx","cx"],["i-cy","cy"],["i-r","r"],["i-span","span"],["i-start","start"],["i-n","n"]]) {
    $("#" + id).value = S[key];
  }
  render();
});
layout(); render();
</script>
</body>
</html>
