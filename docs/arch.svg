<svg viewBox="0 0 1040 620" font-family="'Segoe UI','Microsoft YaHei',sans-serif" role="img" aria-label="技术架构图">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 Z" fill="#66666e"/>
        </marker>
        <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/>
        </marker>
      </defs>
      <style>
        .box { fill: #141416; stroke: #34343c; stroke-width: 1.2; }
        .box-hot { fill: #141416; stroke: #fbbf24; stroke-width: 1.4; }
        .t1 { fill: #ececec; font-size: 15px; font-weight: 700; }
        .t2 { fill: #9a9aa2; font-size: 11.5px; }
        .t3 { fill: #66666e; font-size: 10.5px; letter-spacing: 2px; font-weight: 700; }
        .ln { stroke: #66666e; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
        .lnA { stroke: #fbbf24; stroke-width: 1.3; fill: none; marker-end: url(#arrA); }
        .lbl { fill: #9a9aa2; font-size: 11px; }
        .code { fill: #5eead4; font-size: 11px; font-family: Consolas, monospace; }
      </style>
      <text x="20" y="34" class="t3">① AI 工具层</text>
      <rect x="20" y="44" width="230" height="64" rx="12" class="box-hot"/>
      <text x="135" y="70" text-anchor="middle" class="t1">Claude Code</text>
      <text x="135" y="90" text-anchor="middle" class="t2">已接入 · 钩子 + MCP</text>
      <rect x="290" y="44" width="200" height="64" rx="12" class="box"/>
      <text x="390" y="70" text-anchor="middle" class="t1">Codex CLI</text>
      <text x="390" y="90" text-anchor="middle" class="t2">同协议直接接入</text>
      <rect x="530" y="44" width="200" height="64" rx="12" class="box"/>
      <text x="630" y="70" text-anchor="middle" class="t1">Gemini CLI</text>
      <text x="630" y="90" text-anchor="middle" class="t2">同协议直接接入</text>
      <rect x="770" y="44" width="230" height="64" rx="12" class="box" stroke-dasharray="5 4"/>
      <text x="885" y="70" text-anchor="middle" class="t1">DSH / 其他</text>
      <text x="885" y="90" text-anchor="middle" class="t2">注册一条命令即可</text>

      <text x="20" y="164" class="t3">② 接入层（标准协议）</text>
      <rect x="20" y="174" width="300" height="96" rx="12" class="box"/>
      <text x="170" y="200" text-anchor="middle" class="t1">Hooks 钩子注入</text>
      <text x="170" y="222" text-anchor="middle" class="t2">SessionStart：注入完整整理协议</text>
      <text x="170" y="242" text-anchor="middle" class="t2">UserPromptSubmit：每轮一行状态提醒</text>
      <text x="170" y="260" text-anchor="middle" class="code">省 95% 上下文的软约束</text>
      <rect x="370" y="174" width="280" height="96" rx="12" class="box"/>
      <text x="510" y="200" text-anchor="middle" class="t1">MCP Server（stdio）</text>
      <text x="510" y="222" text-anchor="middle" class="t2">mind_board_organize 整理</text>
      <text x="510" y="240" text-anchor="middle" class="t2">mind_board_query 回看 · control 管理</text>
      <text x="510" y="258" text-anchor="middle" class="code">AI 主动调用的硬入口</text>
      <rect x="700" y="174" width="300" height="96" rx="12" class="box"/>
      <text x="850" y="200" text-anchor="middle" class="t1">本地 HTTP 服务</text>
      <text x="850" y="222" text-anchor="middle" class="t2">127.0.0.1:13134 · REST + 静态页</text>
      <text x="850" y="242" text-anchor="middle" class="t2">桌宠唯一的数据通道 · 浏览器兜底</text>
      <text x="850" y="260" text-anchor="middle" class="code">壳与数据解耦面</text>

      <text x="20" y="330" class="t3">③ 数据中枢（唯一事实源）</text>
      <rect x="240" y="344" width="420" height="104" rx="12" class="box-hot"/>
      <text x="450" y="372" text-anchor="middle" class="t1">store.mjs — 纯 Node · 零依赖</text>
      <text x="450" y="394" text-anchor="middle" class="t2">同层去重（字符 bigram 相似度 ≥0.7 视为同条）</text>
      <text x="450" y="412" text-anchor="middle" class="t2">目标漂移检测：疑似换目标 → 拒写并要求 AI 先问你</text>
      <text x="450" y="430" text-anchor="middle" class="t2">临时文件 + rename 原子写盘 · journal.jsonl 事件流</text>
      <rect x="710" y="344" width="290" height="104" rx="12" class="box"/>
      <text x="855" y="372" text-anchor="middle" class="t1">~/.mind-board/</text>
      <text x="855" y="394" text-anchor="middle" class="code">projects/  skeletons/</text>
      <text x="855" y="412" text-anchor="middle" class="code">journal.jsonl  settings.json</text>
      <text x="855" y="432" text-anchor="middle" class="t2">可备份 · 可导出 · 可手改</text>

      <text x="20" y="506" class="t3">④ 桌宠壳（可抛弃的展示层）</text>
      <rect x="20" y="516" width="230" height="80" rx="12" class="box"/>
      <text x="135" y="544" text-anchor="middle" class="t1">小黑猫窗</text>
      <text x="135" y="564" text-anchor="middle" class="t2">透明 · 逐像素命中 · 呼吸动画</text>
      <rect x="290" y="516" width="230" height="80" rx="12" class="box"/>
      <text x="405" y="544" text-anchor="middle" class="t1">图标环</text>
      <text x="405" y="564" text-anchor="middle" class="t2">扇形芯片 · 运行光晕</text>
      <rect x="560" y="516" width="230" height="80" rx="12" class="box"/>
      <text x="675" y="544" text-anchor="middle" class="t1">思维板面板</text>
      <text x="675" y="564" text-anchor="middle" class="t2">四层骨架 · 拖拽整理 · 要点预览</text>
      <rect x="830" y="516" width="180" height="80" rx="12" class="box"/>
      <text x="920" y="544" text-anchor="middle" class="t1">总览仪表盘</text>
      <text x="920" y="564" text-anchor="middle" class="t2">全部项目管理</text>

      <path class="lnA" d="M135 108 L135 174"/>
      <text x="143" y="128" class="lbl">每轮注入状态行</text>
      <path class="lnA" d="M250 76 L370 174"/>
      <text x="268" y="128" class="lbl">工具调用</text>
      <path class="lnA" d="M390 108 L390 174" stroke-dasharray="4 3"/>
      <text x="398" y="146" class="lbl">同为 MCP 协议</text>
      <path class="ln" d="M510 270 L470 344"/>
      <text x="494" y="308" class="lbl">读写</text>
      <path class="ln" d="M850 270 L660 344"/>
      <text x="762" y="308" class="lbl">轮询 · 整理 · 动作</text>
      <path class="ln" d="M660 400 L710 396"/>
      <text x="666" y="388" class="lbl">原子读写</text>
    </svg>
