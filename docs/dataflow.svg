<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="900" height="420" fill="#0d0d0f"/>
  <style>
    .t1{fill:#ececec;font-size:13.5px;font-weight:700}
    .t2{fill:#9a9aa2;font-size:11px}
    .t3{fill:#66666e;font-size:10.5px;letter-spacing:2px;font-weight:700}
    .code{fill:#5eead4;font-family:Consolas,monospace;font-size:10.5px}
    .box{fill:#141416;stroke:#34343c;stroke-width:1.2;rx:9}
    .hot{stroke:#fbbf24}
    .ln{stroke:#66666e;stroke-width:1.4;fill:none}
    .n{fill:#0d0d0f;stroke:#34343c;stroke-width:1;font-size:10px;rx:999}
  </style>

  <text x="24" y="34" class="t3">DATA FLOW · 一轮对话的整理闭环</text>

  <!-- 步骤编号 -->
  <circle cx="120" cy="100" r="16" class="n"/><text x="120" y="105" text-anchor="middle" fill="#9a9aa2" font-size="11">1</text>
  <circle cx="320" cy="100" r="16" class="n"/><text x="320" y="105" text-anchor="middle" fill="#9a9aa2" font-size="11">2</text>
  <circle cx="530" cy="100" r="16" class="n"/><text x="530" y="105" text-anchor="middle" fill="#9a9aa2" font-size="11">3</text>
  <circle cx="750" cy="100" r="16" class="n"/><text x="750" y="105" text-anchor="middle" fill="#9a9aa2" font-size="11">4</text>

  <!-- 1 用户发言 -->
  <rect x="40" y="130" width="160" height="86" class="box"/>
  <text x="120" y="156" text-anchor="middle" class="t1">用户发言</text>
  <text x="120" y="178" text-anchor="middle" class="t2">新想法 / 结论 / 疑问</text>
  <text x="120" y="198" text-anchor="middle" class="code">user/message</text>

  <!-- 2 中控 -->
  <rect x="240" y="130" width="190" height="86" class="box hot"/>
  <text x="335" y="156" text-anchor="middle" class="t1">数据中枢 store</text>
  <text x="335" y="178" text-anchor="middle" class="t2">归属检测 · 目标偏移拦截</text>
  <text x="335" y="198" text-anchor="middle" class="code">charJaccard &lt; 0.25 ?</text>

  <!-- 3 写入 -->
  <rect x="470" y="130" width="160" height="86" class="box"/>
  <text x="550" y="156" text-anchor="middle" class="t1">骨架写盘</text>
  <text x="550" y="178" text-anchor="middle" class="t2">四层合并 · 同层去重</text>
  <text x="550" y="198" text-anchor="middle" class="code">tmp + rename 原子</text>

  <!-- 4 桌宠 -->
  <rect x="690" y="130" width="170" height="86" class="box"/>
  <text x="775" y="156" text-anchor="middle" class="t1">桌宠动效</text>
  <text x="775" y="178" text-anchor="middle" class="t2">journal 事件 → 环/面板刷新</text>
  <text x="775" y="198" text-anchor="middle" class="code">竖耳提醒 · 光效</text>

  <!-- 连线 -->
  <path class="ln" d="M200 173 L238 173"/>
  <path class="ln" d="M430 173 L468 173"/>
  <path class="ln" d="M630 173 L688 173"/>
  <text x="219" y="164" text-anchor="middle" fill="#66666e" font-size="10">注入状态行</text>
  <text x="449" y="164" text-anchor="middle" fill="#66666e" font-size="10">工具调用</text>
  <text x="659" y="164" text-anchor="middle" fill="#66666e" font-size="10">事件流</text>

  <!-- 下半：目标偏移拦截分支 -->
  <rect x="240" y="256" width="300" height="96" class="box"/>
  <text x="390" y="282" text-anchor="middle" class="t1">疑似新目标？→ 强制确认</text>
  <text x="390" y="304" text-anchor="middle" class="t2">pendingNewTask + isError</text>
  <text x="390" y="324" text-anchor="middle" class="t2">agent 必须先问用户，同意才 new-goal</text>
  <text x="390" y="344" text-anchor="middle" class="code">prompt 管不住的，用协议机制管</text>

  <path class="ln" stroke="#f0716c" stroke-dasharray="4 3" d="M335 216 L335 254"/>
  <text x="344" y="240" fill="#f0716c" font-size="10">否（低相似度）</text>

  <rect x="590" y="256" width="266" height="96" class="box"/>
  <text x="723" y="282" text-anchor="middle" class="t1">同目标 → 静默合并</text>
  <text x="723" y="304" text-anchor="middle" class="t2">mergeList 精确/相似度≥0.7 更新</text>
  <text x="723" y="324" text-anchor="middle" class="t2">plans：chosen 全局唯一</text>
  <text x="723" y="344" text-anchor="middle" class="code">整理是副业，回答是主业</text>

  <path class="ln" stroke="#58a873" stroke-dasharray="4 3" d="M550 216 L550 240 L600 240 L648 277"/>
  <text x="556" y="234" fill="#58a873" font-size="10">是</text>
</svg>
