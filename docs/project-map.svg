<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="900" height="560" fill="#0d0d0f"/>
  <style>
    .t1{fill:#ececec;font-size:14px;font-weight:700}
    .t2{fill:#9a9aa2;font-size:11.5px}
    .t3{fill:#66666e;font-size:10.5px;letter-spacing:2px;font-weight:700}
    .dir{fill:#141416;stroke:#34343c;stroke-width:1.2;rx:10}
    .hot{stroke:#fbbf24;fill:#141416}
    .code{fill:#5eead4;font-family:Consolas,monospace;font-size:11.5px}
    .leaf{fill:#5ea3f7;font-family:Consolas,monospace;font-size:11px}
  </style>

  <text x="24" y="34" class="t3">PROJECT MAP · 项目地图</text>
  <text x="24" y="58" class="t1">mind-board-pet</text>
  <text x="24" y="78" class="t2">一份数据核心，四个接入壳 —— 多入口设计（v0.3.0）</text>

  <!-- 核心 -->
  <rect x="24" y="100" width="230" height="150" class="dir hot"/>
  <text x="139" y="128" text-anchor="middle" class="t1">核心（harness 无关）</text>
  <text x="139" y="152" text-anchor="middle" class="code">src/core/store.mjs</text>
  <text x="139" y="172" text-anchor="middle" class="t2">四层骨架 · 原子写盘 · 目标检测</text>
  <text x="139" y="192" text-anchor="middle" class="code">src/core/protocol.mjs</text>
  <text x="139" y="212" text-anchor="middle" class="t2">协议文本 · 状态行</text>
  <text x="139" y="236" text-anchor="middle" class="t3">~/.mind-board/（共享数据根）</text>

  <!-- 入口 A/B  上排 -->
  <rect x="280" y="100" width="280" height="150" class="dir"/>
  <text x="420" y="128" text-anchor="middle" class="t1">A · MCP stdio（任何 harness）</text>
  <text x="420" y="152" text-anchor="middle" class="code">src/mcp/server.mjs</text>
  <text x="420" y="174" text-anchor="middle" class="t2">organize / query / control 三工具</text>
  <text x="420" y="196" text-anchor="middle" class="t3">Claude Code · Codex · Gemini CLI…</text>
  <text x="420" y="232" text-anchor="middle" class="t2">bin: mind-board-mcp（npx 可拉起）</text>

  <rect x="590" y="100" width="286" height="150" class="dir"/>
  <text x="733" y="128" text-anchor="middle" class="t1">B · Claude Code 钩子</text>
  <text x="733" y="152" text-anchor="middle" class="code">src/hooks/*.mjs</text>
  <text x="733" y="174" text-anchor="middle" class="t2">SessionStart 注入全量协议</text>
  <text x="733" y="194" text-anchor="middle" class="t2">UserPromptSubmit 每轮状态行</text>
  <text x="733" y="230" text-anchor="middle" class="t3">.claude/settings.local.json 挂载</text>

  <!-- 入口 C/D  下排 -->
  <rect x="24" y="290" width="420" height="160" class="dir"/>
  <text x="234" y="318" text-anchor="middle" class="t1">C · Electron 壳（桌宠）</text>
  <text x="234" y="342" text-anchor="middle" class="code">src/main/main.cjs</text>
  <text x="234" y="364" text-anchor="middle" class="t2">猫窗（setShape 原生穿透）· 图标环 · 思维面板 · 设置窗</text>
  <text x="234" y="384" text-anchor="middle" class="t2">单实例锁 · 位置记忆 · Ctrl+Alt+B/H</text>
  <text x="234" y="420" text-anchor="middle" class="t3">npm start / 喵喵启动.bat / install.bat</text>

  <rect x="470" y="290" width="406" height="160" class="dir"/>
  <text x="673" y="318" text-anchor="middle" class="t1">D · DSH Cordis 插件壳</text>
  <text x="673" y="342" text-anchor="middle" class="code">src/dsh/index.js</text>
  <text x="673" y="364" text-anchor="middle" class="t2">tools.register（同 schema · projectId 寻址）</text>
  <text x="673" y="384" text-anchor="middle" class="t2">agent/pre-step 注入 · session/event 任务生命周期</text>
  <text x="673" y="420" text-anchor="middle" class="t3">scripts/install-dsh.ps1 一键挂载</text>

  <!-- 服务与文档 -->
  <rect x="24" y="478" width="440" height="64" class="dir"/>
  <text x="60" y="504" class="t1">本地服务</text>
  <text x="60" y="528" class="code">src/server/app.mjs · 127.0.0.1:13134</text>
  <text x="316" y="504" class="t1">测试</text>
  <text x="316" y="528" class="code">npm test（23+12 项冒烟）</text>

  <rect x="490" y="478" width="386" height="64" class="dir"/>
  <text x="510" y="504" class="t1">产品主页</text>
  <text x="510" y="528" class="code">index.html（GitHub Pages）· src/renderer/docs/*.html</text>
</svg>
